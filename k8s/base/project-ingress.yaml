apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blogcms-ingress
  namespace: blogcms
spec:
  ingressClassName: nginx
  rules:
  - host: blogcms.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 5173
  - host: api.blogcms.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 3000
