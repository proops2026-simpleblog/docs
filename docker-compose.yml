services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - blogcms-net

  user-service:
    build: ../user-service
    env_file:
      - ../user-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - blogcms-net
  content-service:
    build: ../content-service
    env_file:
      - ../content-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - blogcms-net
  gateway:
    build: ../gateway
    env_file:
      - ../gateway/.env
    ports:
      - "3000:3000"
    depends_on:
      user-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - blogcms-net
  frontend:
    build: ../frontend
    env_file:
      - ../frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - blogcms-net
volumes:
  postgres_data:

networks:
  blogcms-net:
    driver: bridge
